name: Build, push, and deploy

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: Deploy to production after dev verification and approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and run tests
        run: ./gradlew --warning-mode all clean build shadowJar
      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 1

  build:
    name: Build and push image (NAIS)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifacts
          path: build/

      - name: Build & push (to NAIS registry)
        id: docker
        uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a # v0
        with:
          team: team-oebs
          platforms: linux/amd64
          cache_from: type=gha
          cache_to: type=gha,mode=max

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      # Stopper deploy hvis imaget mangler JDK_JAVA_OPTIONS, truststore, Java 21 eller Oslo-tidssone
      - name: Smoke test image
        env:
          IMAGE: ${{ steps.docker.outputs.image }}
        run: .github/smoke/smoke-test-image.sh "$IMAGE"

  deploy-dev:
    name: Deploy to NAIS dev
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev-fss:team-oebs
    concurrency:
      group: ehandelkanal-2-dev-fss
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$GITHUB_SHA" ]] || { echo "::error::Main has advanced; deploy the current main revision instead"; exit 1; }
      - name: Prepare verified main baseline
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          [[ "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]] || { echo "::error::Main image must include a digest"; exit 1; }
          mkdir -p dev-main-baseline
          cp .nais/naiserator.yaml .nais/config-dev.yaml dev-main-baseline/
          jq -n --arg image "$IMAGE" --arg commit "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" \
            '{image: $image, commit: $commit, run_id: $run_id}' > dev-main-baseline/deployment.json
          printf 'Main commit: `%s`\n\nDev image: `%s`\n' "$GITHUB_SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Record dev deployment starting
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-deploy-started
          path: dev-main-baseline/deployment.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - uses: nais/deploy/actions/deploy@1de80da70ad26556ecdc5964a8b7ec3bbed98120 # v2
        env:
          CLUSTER: dev-fss
          RESOURCE: .nais/naiserator.yaml
          VARS: .nais/config-dev.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
          ENVIRONMENT: dev-fss:team-oebs
          WAIT: "true"
          TIMEOUT: 15m
      - name: Record verified main baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-main-baseline
          path: dev-main-baseline/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  deploy-prod:
    name: Deploy to NAIS prod
    needs: [build, deploy-dev]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod-fss:team-oebs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: nais/deploy/actions/deploy@1de80da70ad26556ecdc5964a8b7ec3bbed98120 # v2
        env:
          CLUSTER: prod-fss
          RESOURCE: .nais/naiserator.yaml
          VARS: .nais/config-prod.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
          ENVIRONMENT: prod-fss:team-oebs
          WAIT: "true"
          TIMEOUT: 15m
