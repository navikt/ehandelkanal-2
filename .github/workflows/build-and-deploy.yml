name: Build, push, and deploy

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: Deploy to production after dev verification and approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and run tests
        run: ./gradlew --warning-mode all clean build shadowJar
      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: build/
          retention-days: 1

  build:
    name: Build and push image (NAIS)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: build/

      - name: Build & push (to NAIS registry)
        id: docker
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        with:
          team: team-oebs
          platforms: linux/amd64
          cache_from: type=gha
          cache_to: type=gha,mode=max

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Stopper deploy hvis imaget mangler JDK_JAVA_OPTIONS, truststore, Java 21 eller Oslo-tidssone
      - name: Smoke test image
        env:
          IMAGE: ${{ steps.docker.outputs.image }}
        run: .github/smoke/smoke-test-image.sh "$IMAGE"

  deploy-dev:
    name: Deploy to NAIS dev
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev-fss:team-oebs
    concurrency:
      group: ehandelkanal-2-dev-fss
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$GITHUB_SHA" ]] || { echo "::error::Main has advanced; deploy the current main revision instead"; exit 1; }
      - name: Prepare verified main baseline
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          [[ "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]] || { echo "::error::Main image must include a digest"; exit 1; }
          mkdir -p dev-main-baseline
          cp .nais/naiserator.yaml .nais/config-dev.yaml dev-main-baseline/
          jq -n --arg image "$IMAGE" --arg commit "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" \
            '{image: $image, commit: $commit, run_id: $run_id}' > dev-main-baseline/deployment.json
          printf 'Main commit: `%s`\n\nDev image: `%s`\n' "$GITHUB_SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Record dev deployment starting
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-deploy-started
          path: dev-main-baseline/deployment.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - uses: nais/deploy/actions/deploy@3944168fd20b7eea3818e97de3810f74b54c78ff # v2
        env:
          CLUSTER: dev-fss
          RESOURCE: .nais/naiserator.yaml
          VARS: .nais/config-dev.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
          ENVIRONMENT: dev-fss:team-oebs
          WAIT: "true"
          TIMEOUT: 15m
      - name: Record verified main baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-main-baseline
          path: dev-main-baseline/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  deploy-prod:
    name: Deploy to NAIS prod
    needs: [build, deploy-dev]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod-fss:team-oebs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@3944168fd20b7eea3818e97de3810f74b54c78ff # v2
        env:
          CLUSTER: prod-fss
          RESOURCE: .nais/naiserator.yaml
          VARS: .nais/config-prod.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
          ENVIRONMENT: prod-fss:team-oebs
          WAIT: "true"
          TIMEOUT: 15m
