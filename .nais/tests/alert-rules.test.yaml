rule_files:
  - prometheusrule-dev.yaml
  - prometheusrule-prod.yaml
evaluation_interval: 1m
tests:
  - name: Healthy apps with no message traffic do not alert
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{cluster="prod-fss",namespace="team-oebs",deployment="ehandelkanal-2"}'
        values: '1+0x30'
      - series: 'kube_deployment_status_replicas_available{cluster="dev-fss",namespace="team-oebs",deployment="ehandelkanal-2"}'
        values: '1+0x30'
      - series: 'jvm_memory_bytes_used{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap"}'
        values: '500+0x30'
      - series: 'jvm_memory_bytes_max{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap"}'
        values: '1000+0x30'
      - series: 'jvm_memory_bytes_used{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap"}'
        values: '500+0x30'
      - series: 'jvm_memory_bytes_max{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap"}'
        values: '1000+0x30'
      - series: 'jvm_memory_bytes_used{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap",pod="invalid-max"}'
        values: '900+0x30'
      - series: 'jvm_memory_bytes_max{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap",pod="invalid-max"}'
        values: '-1+0x30'
    alert_rule_test:
      - {eval_time: 30m, alertname: EhandelkanalUnavailable, exp_alerts: []}
      - {eval_time: 30m, alertname: EhandelkanalMetricsMissing, exp_alerts: []}
      - {eval_time: 30m, alertname: EhandelkanalHeapPressure, exp_alerts: []}
      - {eval_time: 30m, alertname: EhandelkanalRepeatedRestarts, exp_alerts: []}
      - {eval_time: 30m, alertname: EhandelkanalOomKilled, exp_alerts: []}
      - {eval_time: 30m, alertname: EhandelkanalLegalArchiveFailed, exp_alerts: []}
      - {eval_time: 30m, alertname: EhandelkanalManualDeliveryFailed, exp_alerts: []}
      - {eval_time: 30m, alertname: EhandelkanalReportWriteFailed, exp_alerts: []}
      - {eval_time: 30m, alertname: EhandelkanalManualProcessing, exp_alerts: []}
      - {eval_time: 30m, alertname: EhandelkanalXmlParsingFailed, exp_alerts: []}

  - name: Availability tolerates short deploys and uses different dev and prod delays
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{cluster="prod-fss",namespace="team-oebs",deployment="ehandelkanal-2"}'
        values: '0+0x20'
      - series: 'kube_deployment_status_replicas_available{cluster="dev-fss",namespace="team-oebs",deployment="ehandelkanal-2"}'
        values: '0+0x20'
    alert_rule_test:
      - {eval_time: 4m, alertname: EhandelkanalUnavailable, exp_alerts: []}
      - eval_time: 5m
        alertname: EhandelkanalUnavailable
        exp_alerts:
          - exp_labels: &prod_critical
              namespace: team-oebs
              app: ehandelkanal-2
              env: prod-fss
              alert_type: custom
              severity: critical
      - eval_time: 14m
        alertname: EhandelkanalUnavailable
        exp_alerts:
          - exp_labels: *prod_critical
      - eval_time: 15m
        alertname: EhandelkanalUnavailable
        exp_alerts:
          - exp_labels: *prod_critical
          - exp_labels: &dev_warning
              namespace: team-oebs
              app: ehandelkanal-2
              env: dev-fss
              alert_type: custom
              severity: warning

  - name: Completely missing series are not interpreted as healthy
    interval: 1m
    alert_rule_test:
      - {eval_time: 9m, alertname: EhandelkanalMetricsMissing, exp_alerts: []}
      - eval_time: 10m
        alertname: EhandelkanalMetricsMissing
        exp_alerts:
          - exp_labels: &prod_warning
              namespace: team-oebs
              app: ehandelkanal-2
              env: prod-fss
              alert_type: custom
              severity: warning
      - eval_time: 19m
        alertname: EhandelkanalMetricsMissing
        exp_alerts:
          - exp_labels: *prod_warning
      - eval_time: 20m
        alertname: EhandelkanalMetricsMissing
        exp_alerts:
          - exp_labels: *prod_warning
          - exp_labels: *dev_warning

  - name: Heap pressure persists for ten minutes and aggregates multiple pods
    interval: 1m
    input_series:
      - series: 'jvm_memory_bytes_used{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap",pod="a"}'
        values: '900+0x15'
      - series: 'jvm_memory_bytes_max{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap",pod="a"}'
        values: '1000+0x15'
      - series: 'jvm_memory_bytes_used{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap",pod="b"}'
        values: '950+0x15'
      - series: 'jvm_memory_bytes_max{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap",pod="b"}'
        values: '1000+0x15'
      - series: 'jvm_memory_bytes_used{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap",pod="a"}'
        values: '900+0x15'
      - series: 'jvm_memory_bytes_max{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap",pod="a"}'
        values: '1000+0x15'
    alert_rule_test:
      - {eval_time: 9m, alertname: EhandelkanalHeapPressure, exp_alerts: []}
      - eval_time: 10m
        alertname: EhandelkanalHeapPressure
        exp_alerts:
          - exp_labels: *prod_warning
          - exp_labels: *dev_warning

  - name: Exactly three restarts are tolerated but four alert
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",pod="a"}'
        values: '0+1x5'
      - series: 'kube_pod_container_status_restarts_total{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2",pod="a"}'
        values: '0+1x5'
    alert_rule_test:
      - {eval_time: 3m, alertname: EhandelkanalRepeatedRestarts, exp_alerts: []}
      - eval_time: 4m
        alertname: EhandelkanalRepeatedRestarts
        exp_alerts:
          - exp_labels: *prod_warning
          - exp_labels: *dev_warning

  - name: A recent OOM alerts once but a stale termination reason does not persist
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",pod="a",reason="OOMKilled"}'
        values: '0+0x5 1+0x14'
      - series: 'kube_pod_container_status_restarts_total{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",pod="a"}'
        values: '0+0x5 1+0x14'
      - series: 'kube_pod_container_status_last_terminated_reason{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2",pod="a",reason="OOMKilled"}'
        values: '0+0x5 1+0x14'
      - series: 'kube_pod_container_status_restarts_total{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2",pod="a"}'
        values: '0+0x5 1+0x14'
    alert_rule_test:
      - {eval_time: 5m, alertname: EhandelkanalOomKilled, exp_alerts: []}
      - eval_time: 6m
        alertname: EhandelkanalOomKilled
        exp_alerts:
          - exp_labels: *prod_critical
          - exp_labels: *dev_warning
      - {eval_time: 17m, alertname: EhandelkanalOomKilled, exp_alerts: []}

  - name: Final failures alert in the correct environment, handle counter resets and resolve
    interval: 1m
    input_series:
      - series: 'ehandelkanal_2_exhausted_deliveries_legalarchive_total{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2"}'
        values: &events '4 4 0 1+0x12'
      - series: 'ehandelkanal_2_exhausted_deliveries_legalarchive_total{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2"}'
        values: *events
      - series: 'ehandelkanal_2_exhausted_deliveries_errorhandler_total{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2"}'
        values: *events
      - series: 'ehandelkanal_2_exhausted_deliveries_errorhandler_total{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2"}'
        values: *events
      - series: 'ehandelkanal_2_exhausted_deliveries_report_total{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2"}'
        values: *events
      - series: 'ehandelkanal_2_exhausted_deliveries_report_total{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2"}'
        values: *events
      - series: 'ehandelkanal_2_messages_failed_total{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2"}'
        values: *events
      - series: 'ehandelkanal_2_messages_failed_total{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2"}'
        values: *events
      - series: 'ehandelkanal_2_xml_parsing_errors_total{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2"}'
        values: *events
      - series: 'ehandelkanal_2_xml_parsing_errors_total{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2"}'
        values: *events
    alert_rule_test:
      - {eval_time: 2m, alertname: EhandelkanalLegalArchiveFailed, exp_alerts: []}
      - {eval_time: 2m, alertname: EhandelkanalManualDeliveryFailed, exp_alerts: []}
      - {eval_time: 2m, alertname: EhandelkanalReportWriteFailed, exp_alerts: []}
      - {eval_time: 2m, alertname: EhandelkanalManualProcessing, exp_alerts: []}
      - {eval_time: 2m, alertname: EhandelkanalXmlParsingFailed, exp_alerts: []}
      - eval_time: 3m
        alertname: EhandelkanalLegalArchiveFailed
        exp_alerts:
          - exp_labels: *prod_critical
          - exp_labels: *dev_warning
      - eval_time: 3m
        alertname: EhandelkanalManualDeliveryFailed
        exp_alerts:
          - exp_labels: *prod_critical
          - exp_labels: *dev_warning
      - eval_time: 3m
        alertname: EhandelkanalReportWriteFailed
        exp_alerts:
          - exp_labels: *prod_warning
          - exp_labels: *dev_warning
      - eval_time: 3m
        alertname: EhandelkanalManualProcessing
        exp_alerts:
          - exp_labels: *prod_warning
          - exp_labels: *dev_warning
      - eval_time: 3m
        alertname: EhandelkanalXmlParsingFailed
        exp_alerts:
          - exp_labels: *prod_warning
          - exp_labels: *dev_warning
      - {eval_time: 14m, alertname: EhandelkanalLegalArchiveFailed, exp_alerts: []}
      - {eval_time: 14m, alertname: EhandelkanalManualDeliveryFailed, exp_alerts: []}
      - {eval_time: 14m, alertname: EhandelkanalReportWriteFailed, exp_alerts: []}
      - {eval_time: 14m, alertname: EhandelkanalManualProcessing, exp_alerts: []}
      - {eval_time: 14m, alertname: EhandelkanalXmlParsingFailed, exp_alerts: []}

  - name: Other clusters, namespaces and applications must not trigger our event rules
    interval: 1m
    input_series:
      - series: 'ehandelkanal_2_exhausted_deliveries_legalarchive_total{cluster="prod-gcp",namespace="team-oebs",container="ehandelkanal-2"}'
        values: '0+1x5'
      - series: 'ehandelkanal_2_exhausted_deliveries_errorhandler_total{cluster="dev-gcp",namespace="team-oebs",container="ehandelkanal-2"}'
        values: '0+1x5'
      - series: 'ehandelkanal_2_exhausted_deliveries_report_total{cluster="prod-fss",namespace="another-team",container="ehandelkanal-2"}'
        values: '0+1x5'
      - series: 'ehandelkanal_2_messages_failed_total{cluster="dev-fss",namespace="team-oebs",container="another-app"}'
        values: '0+1x5'
      - series: 'ehandelkanal_2_xml_parsing_errors_total{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2-other"}'
        values: '0+1x5'
    alert_rule_test:
      - {eval_time: 5m, alertname: EhandelkanalLegalArchiveFailed, exp_alerts: []}
      - {eval_time: 5m, alertname: EhandelkanalManualDeliveryFailed, exp_alerts: []}
      - {eval_time: 5m, alertname: EhandelkanalReportWriteFailed, exp_alerts: []}
      - {eval_time: 5m, alertname: EhandelkanalManualProcessing, exp_alerts: []}
      - {eval_time: 5m, alertname: EhandelkanalXmlParsingFailed, exp_alerts: []}

  - name: A short outage recovers without producing an availability alert
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{cluster="prod-fss",namespace="team-oebs",deployment="ehandelkanal-2"}'
        values: '0+0x3 1+0x16'
      - series: 'kube_deployment_status_replicas_available{cluster="dev-fss",namespace="team-oebs",deployment="ehandelkanal-2"}'
        values: '0+0x3 1+0x16'
    alert_rule_test:
      - {eval_time: 3m, alertname: EhandelkanalUnavailable, exp_alerts: []}
      - {eval_time: 5m, alertname: EhandelkanalUnavailable, exp_alerts: []}
      - {eval_time: 15m, alertname: EhandelkanalUnavailable, exp_alerts: []}

  - name: Heap exactly at 85 percent does not alert
    interval: 1m
    input_series:
      - series: 'jvm_memory_bytes_used{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap"}'
        values: '850+0x15'
      - series: 'jvm_memory_bytes_max{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap"}'
        values: '1000+0x15'
      - series: 'jvm_memory_bytes_used{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap"}'
        values: '850+0x15'
      - series: 'jvm_memory_bytes_max{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap"}'
        values: '1000+0x15'
    alert_rule_test:
      - {eval_time: 15m, alertname: EhandelkanalHeapPressure, exp_alerts: []}

  - name: Metrics recover and clear the missing-data alert
    interval: 1m
    input_series:
      - series: 'jvm_memory_bytes_used{cluster="prod-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap"}'
        values: '_x15 500+0x10'
      - series: 'jvm_memory_bytes_used{cluster="dev-fss",namespace="team-oebs",container="ehandelkanal-2",area="heap"}'
        values: '_x15 500+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: EhandelkanalMetricsMissing
        exp_alerts:
          - exp_labels: *prod_warning
      - {eval_time: 16m, alertname: EhandelkanalMetricsMissing, exp_alerts: []}
      - {eval_time: 21m, alertname: EhandelkanalMetricsMissing, exp_alerts: []}
